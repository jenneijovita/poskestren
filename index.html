<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POSKESTREN - Rekam Medis & Inventaris Obat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary-color: #0f5132;
      --secondary-color: #198754;
      --bg-light: #f8f9fa;
    }
    body {
      background-color: var(--bg-light);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .navbar {
      background-color: var(--primary-color) !important;
    }
    .card {
      border: none;
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      border-radius: 10px;
    }
    .card-header {
      background-color: #fff;
      border-bottom: 2px solid var(--bg-light);
      font-weight: 600;
    }
    .badge-out {
      background-color: #dc3545;
    }
    .badge-low {
      background-color: #ffc107;
      color: #000;
    }

    /* Style Khusus untuk Mode Cetak / Surat Izin */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
        font-family: 'Courier New', Courier, monospace; /* Tampilan mirip format teks ASCII */
        white-space: pre-wrap;
        font-size: 14px;
        line-height: 1.5;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-hospital me-2"></i>POSKESTREN</a>
      <span class="navbar-text text-white small">Sistem Rekam Medis & Stok Obat Santri</span>
    </div>
  </nav>

  <div class="container mb-5">
    <!-- Alert Notifikasi Obat -->
    <div id="alert-container"></div>

    <div class="row">
      <!-- Form Input Rekam Medis -->
      <div class="col-md-5 mb-4">
        <div class="card p-3">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span id="form-title"><i class="bi bi-person-plus me-1"></i> Input Rekam Medis</span>
            <button class="btn btn-sm btn-outline-secondary d-none" id="btn-cancel-edit" onclick="resetFormRM()">Batal</button>
          </div>
          <div class="card-body">
            <form id="form-rm">
              <input type="hidden" id="rm-id">
              <div class="mb-2">
                <label class="form-label small">Nama Lengkap Santri</label>
                <input type="text" class="form-control form-control-sm" id="rm-nama" required>
              </div>
              <div class="row mb-2">
                <div class="col">
                  <label class="form-label small">NIS / ID</label>
                  <input type="text" class="form-control form-control-sm" id="rm-nis" required>
                </div>
                <div class="col">
                  <label class="form-label small">Kamar / Perguruan</label>
                  <input type="text" class="form-control form-control-sm" id="rm-kamar" required>
                </div>
              </div>
              <div class="mb-2">
                <label class="form-label small">Alamat Orang Tua/Wali</label>
                <input type="text" class="form-control form-control-sm" id="rm-alamat-ortu" placeholder="Alamat rumah santri">
              </div>
              <div class="mb-2">
                <label class="form-label small">Hari, Tanggal Pemeriksaan</label>
                <input type="date" class="form-control form-control-sm" id="rm-tanggal" required>
              </div>
              <div class="mb-2">
                <label class="form-label small">Keluhan / Diagnosis</label>
                <textarea class="form-control form-control-sm" id="rm-diagnosis" rows="2" required></textarea>
              </div>
              <div class="mb-2">
                <label class="form-label small">Resep Obat</label>
                <select class="form-select form-select-sm" id="rm-obat">
                  <option value="">-- Pilih Obat --</option>
                </select>
              </div>
              <div class="row mb-3">
                <div class="col">
                  <label class="form-label small">Tgl Keluar (Izin)</label>
                  <input type="date" class="form-control form-control-sm" id="rm-tgl-keluar">
                </div>
                <div class="col">
                  <label class="form-label small">Tgl Kembali</label>
                  <input type="date" class="form-control form-control-sm" id="rm-tgl-kembali">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label small">Nama Petugas Poskestren</label>
                <input type="text" class="form-control form-control-sm" id="rm-petugas" required>
              </div>
              <button type="submit" class="btn btn-success btn-sm w-100" id="btn-save-rm">Simpan Rekam Medis</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Tabel Rekam Medis & Pencarian -->
      <div class="col-md-7 mb-4">
        <div class="card p-3">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-journal-medical me-1"></i> Data Rekam Medis</span>
            <div>
              <button class="btn btn-outline-success btn-sm" onclick="exportData()"><i class="bi bi-file-earmark-excel me-1"></i> Export Excel</button>
            </div>
          </div>
          <div class="card-body">
            <div class="input-group input-group-sm mb-3">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control" id="search-rm" placeholder="Cari nama, NIS, atau diagnosis..." onkeyup="renderRM()">
            </div>
            <div class="table-responsive">
              <table class="table table-hover table-striped align-middle small">
                <thead class="table-dark">
                  <tr>
                    <th>Tgl</th>
                    <th>Nama / NIS</th>
                    <th>Diagnosis</th>
                    <th>Obat</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody id="tbody-rm"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Area Rahasia Khusus Cetak Surat -->
  <div id="print-area"></div>

  <script>
    // Inisialisasi Data Storage
    let rekamMedis = JSON.parse(localStorage.getItem('poskestren_rm')) || [];
    let stokObat = JSON.parse(localStorage.getItem('poskestren_obat')) || [
      { id: 1, nama: 'Paracetamol 500mg', stok: 20, minStok: 5 },
      { id: 2, nama: 'Amoxicillin 500mg', stok: 3, minStok: 5 }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('rm-tanggal').valueAsDate = new Date();
      loadObatOptions();
      checkNotifObat();
      renderRM();
    });

    function saveToStorage() {
      localStorage.setItem('poskestren_rm', JSON.stringify(rekamMedis));
      localStorage.setItem('poskestren_obat', JSON.stringify(stokObat));
    }

    function loadObatOptions() {
      const select = document.getElementById('rm-obat');
      select.innerHTML = '<option value="">-- Pilih Obat --</option>';
      stokObat.forEach(o => {
        select.innerHTML += `<option value="${o.nama}">${o.nama} (Stok: ${o.stok})</option>`;
      });
    }

    function checkNotifObat() {
      const container = document.getElementById('alert-container');
      container.innerHTML = '';
      stokObat.forEach(o => {
        if (o.stok <= 0) {
          container.innerHTML += `<div class="alert alert-danger alert-dismissible fade show p-2 small" role="alert">
            <strong>Peringatan!</strong> Stok obat <strong>${o.nama}</strong> telah HABIS!
            <button type="button" class="btn-close p-2" data-bs-dismiss="alert"></button>
          </div>`;
        } else if (o.stok <= o.minStok) {
          container.innerHTML += `<div class="alert alert-warning alert-dismissible fade show p-2 small" role="alert">
            <strong>Perhatian!</strong> Stok obat <strong>${o.nama}</strong> hampir habis (Sisa: ${o.stok}).
            <button type="button" class="btn-close p-2" data-bs-dismiss="alert"></button>
          </div>`;
        }
      });
    }

    // Handle Form Submit
    document.getElementById('form-rm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('rm-id').value;
      const data = {
        id: id ? parseInt(id) : Date.now(),
        nama: document.getElementById('rm-nama').value,
        nis: document.getElementById('rm-nis').value,
        kamar: document.getElementById('rm-kamar').value,
        alamatOrtu: document.getElementById('rm-alamat-ortu').value || '-',
        tanggal: document.getElementById('rm-tanggal').value,
        diagnosis: document.getElementById('rm-diagnosis').value,
        obat: document.getElementById('rm-obat').value || '-',
        tglKeluar: document.getElementById('rm-tgl-keluar').value || '-',
        tglKembali: document.getElementById('rm-tgl-kembali').value || '-',
        petugas: document.getElementById('rm-petugas').value
      };

      if (id) {
        const index = rekamMedis.findIndex(r => r.id === parseInt(id));
        rekamMedis[index] = data;
      } else {
        rekamMedis.push(data);
        // Kurangi stok obat jika ada resep
        if (data.obat !== '-') {
          const item = stokObat.find(o => o.nama === data.obat);
          if (item && item.stok > 0) item.stok -= 1;
        }
      }

      saveToStorage();
      resetFormRM();
      renderRM();
      checkNotifObat();
      loadObatOptions();
    });

    function renderRM() {
      const keyword = document.getElementById('search-rm').value.toLowerCase();
      const tbody = document.getElementById('tbody-rm');
      tbody.innerHTML = '';

      const filtered = rekamMedis.filter(r => 
        r.nama.toLowerCase().includes(keyword) || 
        r.nis.toLowerCase().includes(keyword) || 
        r.diagnosis.toLowerCase().includes(keyword)
      );

      filtered.forEach(r => {
        tbody.innerHTML += `
          <tr>
            <td>${r.tanggal}</td>
            <td><strong>${r.nama}</strong><br><small class="text-muted">${r.nis} (${r.kamar})</small></td>
            <td>${r.diagnosis}</td>
            <td>${r.obat}</td>
            <td>
              <button class="btn btn-sm btn-info text-white me-1" onclick="cetakSurat(${r.id})" title="Cetak Surat Izin"><i class="bi bi-printer"></i></button>
              <button class="btn btn-sm btn-warning text-white me-1" onclick="editRM(${r.id})" title="Edit"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-danger" onclick="hapusRM(${r.id})" title="Hapus"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        `;
      });
    }

    function resetFormRM() {
      document.getElementById('form-rm').reset();
      document.getElementById('rm-id').value = '';
      document.getElementById('form-title').innerText = 'Input Rekam Medis';
      document.getElementById('btn-cancel-edit').classList.add('d-none');
      document.getElementById('rm-tanggal').valueAsDate = new Date();
    }

    function editRM(id) {
      const r = rekamMedis.find(item => item.id === id);
      if (!r) return;
      document.getElementById('rm-id').value = r.id;
      document.getElementById('rm-nama').value = r.nama;
      document.getElementById('rm-nis').value = r.nis;
      document.getElementById('rm-kamar').value = r.kamar;
      document.getElementById('rm-alamat-ortu').value = r.alamatOrtu;
      document.getElementById('rm-tanggal').value = r.tanggal;
      document.getElementById('rm-diagnosis').value = r.diagnosis;
      document.getElementById('rm-obat').value = r.obat;
      document.getElementById('rm-tgl-keluar').value = r.tglKeluar !== '-' ? r.tglKeluar : '';
      document.getElementById('rm-tgl-kembali').value = r.tglKembali !== '-' ? r.tglKembali : '';
      document.getElementById('rm-petugas').value = r.petugas;

      document.getElementById('form-title').innerText = 'Edit Rekam Medis';
      document.getElementById('btn-cancel-edit').classList.remove('d-none');
    }

    function hapusRM(id) {
      if (confirm('Apakah Anda yakin ingin menghapus data rekam medis ini?')) {
        rekamMedis = rekamMedis.filter(r => r.id !== id);
        saveToStorage();
        renderRM();
      }
    }

    // Fungsi Cetak Surat Sesuai Template Teks Pilihan Anda
    function cetakSurat(id) {
      const r = rekamMedis.find(item => item.id === id);
      if (!r) return;

      const formatSurat = `
================================================================================
                        POS KESEHATAN PESANTREN (POSKESTREN)
                              PONDOK PESANTREN [NAMA PESANTREN]
                  Alamat: [Alamat Lengkap Pesantren, Kota/Kabupaten]
                  Telp/WA: [Nomor Telepon/HP Pengurus/Poskestren]
================================================================================

                      SURAT KETERANGAN SAKIT & IZIN PULANG
                           Nomor: ${r.id}/POSKESTREN/X/2026

Yang bertanda tangan di bawah ini, Petugas Poskestren [Nama Pesantren], menerangkan bahwa:

Nama Santri         : ${r.nama}
NIS / ID Santri     : ${r.nis}
Kamar / Perguruan   : ${r.kamar}
Alamat Orang Tua/Wali: ${r.alamatOrtu}

Berdasarkan hasil pemeriksaan kesehatan di Poskestren pada:
Hari, Tanggal       : ${r.tanggal}
Keluhan / Diagnosis : ${r.diagnosis}

Dengan ini menyatakan bahwa santri tersebut di atas dalam kondisi SAKIT dan MEMERLUKAN ISTIRAHAT DI RUMAH serta pemeriksaan medis lebih lanjut. 

Diberikan izin pulang sementara terhitung mulai:
Tanggal Keluar      : ${r.tglKeluar}
Tanggal Kembali     : ${r.tglKembali}

Catatan / Imbauan Medis:
1. Santri diimbau untuk memeriksakan kembali kondisinya ke Fasilitas Kesehatan (Klinik/Puskesmas/Rumah Sakit/Dokter) terdekat selama di rumah.
2. Membawa kembali Surat Keterangan Berobat dari Dokter/Faskes saat kembali ke pesantren sebagai bukti pemeriksaan ulang.
3. Apabila hingga batas waktu tanggal kembali kondisi santri belum membaik, Orang Tua/Wali wajib mengonfirmasi dan memperpanjang izin ke Pengurus Pesantren.

Demikian surat keterangan izin ini dibuat agar dapat dipergunakan sebagaimana mestinya. Atas perhatian dan kerja samanya, kami ucapkan terima kasih.


[Kota Pesantren], ${r.tanggal}

    Petugas Kesehatan Poskestren,                        
                                            




  ( ${r.petugas} )                                   
`;

      document.getElementById('print-area').innerText = formatSurat;
      window.print();
    }

    // Export Data Rekam Medis ke Excel
    function exportData() {
      const ws = XLSX.utils.json_to_sheet(rekamMedis);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Rekam Medis");
      XLSX.writeFile(wb, "Data_Rekam_Medis_Poskestren.xlsx");
    }
  </script>
</body>
</html>

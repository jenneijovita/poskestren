<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - POSKESTREN</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #061412;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background-color: #0b1e1b;
      border: 1px solid #133a34;
      border-radius: 12px;
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .logo-icon {
      width: 50px;
      height: 50px;
      background-color: #00a878;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 24px;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 12px;
      color: #00d294;
      margin-bottom: 25px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      color: #8fa8a3;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      background-color: #051815;
      border: 1px solid #163d36;
      border-radius: 8px;
      color: #ffffff;
      outline: none;
    }
    .form-group input:focus {
      border-color: #00d294;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #00a878;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    .btn-submit:hover {
      background-color: #00d294;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-icon">💚</div>
    <div class="title">POSKESTREN</div>
    <div class="subtitle">Pos Kesehatan Pesantren Integrasi</div>

    <form id="loginForm">
      <div class="form-group">
        <label>USERNAME</label>
        <input type="text" id="username" placeholder="Masukkan username..." required />
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="password" placeholder="Masukkan password..." required />
      </div>
      <button type="submit" class="btn-submit">MASUK SEKARANG &rarr;</button>
    </form>
  </div>

  <script>
    // 1. Jika sudah login, langsung lempar ke index.html (dashboard)
    if (localStorage.getItem('isLoggedIn') === 'true') {
      window.location.href = 'index.html';
    }

    // 2. Fungsi Login
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Simpan status login
      localStorage.setItem('isLoggedIn', 'true');
      
      // Pindah ke halaman dashboard
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - POSKESTREN</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0a131f;
      color: #ffffff;
    }
    /* Header / Navbar */
    .navbar {
      background-color: #0d1b2a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 30px;
      border-bottom: 1px solid #1e2d3d;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      background-color: #00a878;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .brand-title {
      font-size: 18px;
      font-weight: bold;
    }
    .brand-subtitle {
      font-size: 11px;
      color: #6b7c93;
    }
    .nav-links {
      display: flex;
      gap: 10px;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: #8fa8a3;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .nav-btn.active {
      background-color: #00a878;
      color: #ffffff;
      font-weight: bold;
    }
    /* Tombol Logout */
    .btn-logout {
      background-color: #e63946;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-logout:hover {
      background-color: #c1121f;
    }
    /* Main Content */
    .container {
      padding: 30px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background-color: #112233;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #1c3144;
    }
    .card-title {
      font-size: 12px;
      color: #8fa8a3;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .card-value {
      font-size: 36px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Proteksi Akses (Script ditaruh di atas agar cepat mengecek) -->
  <script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>

  <!-- Navbar / Header -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-icon">💚</div>
      <div>
        <div class="brand-title">POSKESTREN</div>
        <div class="brand-subtitle">Pos Kesehatan Pesantren Modern</div>
      </div>
    </div>

    <nav class="nav-links">
      <button class="nav-btn active">📊 Dashboard</button>
      <button class="nav-btn">📋 Rekam Medis</button>
      <button class="nav-btn">💊 Stok Obat</button>
      <button class="nav-btn">📝 Surat Izin Sakit</button>
    </nav>

    <!-- Tombol Logout -->
    <button id="btnLogout" class="btn-logout">Logout</button>
  </header>

  <!-- Konten Dashboard -->
  <main class="container">
    <div class="cards-grid">
      <div class="card">
        <div class="card-title">PASIEN HARI INI</div>
        <div class="card-value">1</div>
      </div>
      <div class="card">
        <div class="card-title">TOTAL REKAM MEDIS</div>
        <div class="card-value">1</div>
      </div>
      <div class="card">
        <div class="card-title">OBAT MENIPIS / HABIS</div>
        <div class="card-value">2</div>
      </div>
    </div>
  </main>

  <script>
    // Fungsi Logout
    document.getElementById('btnLogout').addEventListener('click', function() {
      // Hapus status login
      localStorage.removeItem('isLoggedIn');
      
      // Kembalikan ke halaman login
      window.location.href = 'login.html';
    });
  </script>

</body>
</html>
